<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Trainer Desk</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@500;600&family=Baloo+2:wght@600;700;800&display=swap" />
  <link rel="stylesheet" href="styles.css" />
  <link rel="stylesheet" href="coaching-compass/cc.css" />
</head>
<body>
  <header class="menubar">
    <div class="menubar-left">
      <span class="brand">Trainer</span>
      <span class="active-app" id="activeApp">Dashboard</span>
    </div>
    <div class="menubar-right">
      <span id="clock"></span>
    </div>
  </header>

  <main class="desktop" id="desktop"></main>

  <nav class="dock" id="dock" aria-label="Apps"></nav>

  <template id="windowTemplate">
    <section class="window" role="dialog">
      <div class="titlebar">
        <div class="traffic">
          <button class="light close" data-action="close" aria-label="Close"></button>
          <button class="light minimize" data-action="minimize" aria-label="Minimize"></button>
          <button class="light maximize" data-action="maximize" aria-label="Maximize"></button>
        </div>
        <h2 class="title"></h2>
      </div>
      <nav class="crumbs" aria-label="Breadcrumb"></nav>
      <div class="content"></div>
      <div class="resize-handle" aria-hidden="true"></div>
    </section>
  </template>

  <!-- Coaching Compass: parked here until its window opens -->
  <div id="ccHolder" hidden>
<div class="cc-root" id="ccRoot">
<button class="ask-fab" id="askFab" type="button" aria-label="Ask AI" title="Ask AI about your saved coaching data">
  <span class="ask-fab-icon"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l1.9 4.6L18.5 9.5l-4.6 1.9L12 16l-1.9-4.6L5.5 9.5l4.6-1.9L12 3z"></path><path d="M19 15l.8 1.9 1.9.8-1.9.8L19 20.4l-.8-1.9-1.9-.8 1.9-.8L19 15z"></path><path d="M5 16.5l.6 1.3 1.3.6-1.3.6L5 20.3l-.6-1.3-1.3-.6 1.3-.6L5 16.5z"></path></svg></span>
  <span class="ask-fab-label">Ask AI</span>
</button>

<div class="ask-pop" id="askPop" role="dialog" aria-label="Ask AI" hidden>
  <div class="ask-pop-head">
    <label class="ask-label" for="askInput">What do you need?</label>
    <button class="ask-pop-close" id="askPopClose" type="button" aria-label="Close">&times;</button>
  </div>
  <div class="ask-row">
    <textarea id="askInput" rows="2" placeholder="e.g. Summarize the knowledge gap analysis for week 558"></textarea>
    <button class="primary" id="askSubmitBtn" type="button">Ask</button>
  </div>
  <div class="ask-chips" id="askChips"></div>
  <p class="hint" id="askScope" style="margin:12px 0 0;"></p>
</div>

<div class="cc-scroll" id="ccScroll">
<div class="shell">
  <main class="main">
    <div class="page-head" id="pageHead">
      <nav class="breadcrumb" id="breadcrumb"></nav>
      <header class="topbar" id="topbar">
        <div>
          <p class="eyebrow" id="sectionEyebrow"></p>
          <h1 id="sectionTitle"></h1>
        </div>
      </header>
    </div>
    <p class="sub page-sub" id="sectionSub"></p>


    <section class="panel" data-panel="home">
      <div class="home" id="homeBody">
        <div class="home-top" id="homeTop">
          <div id="homeHeader"></div>
          <div class="stat-row" id="statRow"></div>
        </div>
        <aside class="home-side" id="homeSide" aria-label="Latest analysis">
          <div id="overviewBody"></div>
        </aside>
        <div id="homeApps"></div>
      </div>
    </section>

    <section class="panel" data-panel="data">
      <div class="subtabs" id="dataTabs" hidden></div>
      <div id="repositoryBody" hidden></div>
      <div id="dataPullView">
        <p class="eyebrow">Trigger request</p>
        <div class="request-grid" id="requestForms"></div>
        <div id="requestResult"></div>
      </div>
    </section>

    <section class="panel" data-panel="ask">
      <div class="ask-page-head"><button class="ghost small" id="askAnotherBtn" type="button">Ask another question</button></div>
      <div id="askAnswers"></div>
    </section>

    <section class="panel" data-panel="team">
      <div class="card"><div id="teamPanel"></div></div>
    </section>

    <section class="panel" data-panel="individual">
      <div class="trainee-picker" id="traineePicker"></div>
      <div class="subtabs week-tabs" id="traineeWeekTabs" hidden></div>
      <div class="trainee-card card" id="traineeCard"></div>
    </section>

    <section class="panel" data-panel="cohorts">
      <div id="cohortsBody"></div>
    </section>

    <section class="panel" data-panel="settings">
      <div class="subtabs" id="resourceTabs"></div>
      <div id="settingsBody"></div>
    </section>

    <div class="report-actions" id="reportActions" hidden>
      <button class="ghost small" id="reportCopyBtn" type="button">Copy</button>
      <button class="ghost small" id="reportDocBtn" type="button">Export to Google Doc</button>
      <span class="report-label" id="reportLabel"></span>
      <span class="save-status" id="reportNote"></span>
    </div>

    <footer class="note">Analysis is generated by Claude from the data you provide &mdash; review before sharing with trainees.</footer>
  </main>
</div>

</div>

<div class="modal-root" id="modalRoot" hidden>
  <div class="modal-backdrop" id="modalBackdrop"></div>
  <div class="modal-card" id="modalCard" role="dialog" aria-modal="true"></div>
</div>

<div class="kebab-menu" id="kebabMenu" hidden></div>
</div>
  </div>

  <script src="app.js"></script>
  <script src="coaching-compass/cc.js"></script>
  <script src="attendance/attendance.js"></script>
  <script src="quiz/quiz.js"></script>
</body>
</html>
