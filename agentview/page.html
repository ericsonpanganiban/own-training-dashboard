<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Agent Scorecard</title>
<style>
:root { color-scheme: light dark; --bg: #f5f5f7; --card: #fff; --fg: #1d1d1f; --muted: #86868b; --line: #e5e5ea; --accent: #0d9488; --window-fg: var(--fg); --window-bg: var(--bg); --success-bg: rgba(52,199,89,.15); --success-ink: #1d7a3a; --warning-bg: rgba(255,149,0,.16); --warning-ink: #a85f00; }
@media (prefers-color-scheme: dark) { :root { --bg: #0b0d10; --card: #16181c; --fg: #e7e9ea; --muted: #8b949e; --line: #2f3336; --success-bg: rgba(0,186,124,.16); --success-ink: #00ba7c; --warning-bg: rgba(255,212,0,.14); --warning-ink: #ffd400; } }
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--fg); font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", Inter, "Segoe UI", Roboto, sans-serif; line-height: 1.5; }
.top { display: flex; align-items: center; justify-content: space-between; padding: 12px 20px; background: #0d9488; color: #fff; font-weight: 700; }
.top button { border: 1px solid rgba(255,255,255,.5); background: none; color: #fff; font: inherit; font-size: 13px; padding: 5px 12px; border-radius: 8px; cursor: pointer; }
.top button[hidden] { display: none; }
.login { max-width: 400px; margin: 9vh auto 0; padding: 28px 24px; background: var(--card); border: 1px solid var(--line); border-radius: 16px; }
.login h1 { margin: 0 0 6px; font-size: 22px; }
.login p { margin: 0 0 18px; color: var(--muted); font-size: 14px; }
.login label { display: grid; gap: 6px; margin-bottom: 14px; font-size: 13px; font-weight: 600; }
.login input { padding: 11px 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--bg); color: var(--fg); font: inherit; font-size: 15px; }
.login input:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
.login button { width: 100%; padding: 12px; border: 0; border-radius: 10px; background: var(--accent); color: #fff; font: inherit; font-weight: 700; font-size: 15px; cursor: pointer; }
.login button[disabled] { opacity: .6; cursor: default; }
.err { min-height: 1.4em; margin: 10px 0 0; color: #dc2626; font-size: 13.5px; }
.small { margin-top: 16px; font-size: 12.5px; color: var(--muted); }
/*__SCORECARD_CSS__*/
</style>
</head>
<body>
<div class="top"><span>Agent Scorecard</span><button type="button" id="out" hidden>Sign out</button></div>
<main id="app">
  <form class="login" id="login" autocomplete="off">
    <h1>Your scorecard</h1>
    <p>Enter your work email to see your scorecard.</p>
    <label>Work email<input type="email" id="email" required autocomplete="username" inputmode="email"></label>
    <button type="submit" id="go">View my scorecard</button>
    <p class="err" id="err" role="alert"></p>
  </form>
</main>
<script type="application/json" id="bundle">/*__BUNDLE__*/</script>
<script>/*__RENDER_JS__*/</script>
<script>/*__CRYPTO_JS__*/</script>
<script>
(function () {
  "use strict";
  var bundle = JSON.parse(document.getElementById("bundle").textContent || "{}");
  var form = document.getElementById("login"), err = document.getElementById("err"), go = document.getElementById("go"), app = document.getElementById("app"), out = document.getElementById("out");
  var loginHtml = form.outerHTML;
  form.addEventListener("submit", async function (e) {
    e.preventDefault();
    err.textContent = "";
    var email = document.getElementById("email").value, code = "";
    go.disabled = true; go.textContent = "Checking…";
    var data = null;
    try {
      var id = await AgentLock.recordId(email);
      var rec = (bundle.records || []).filter(function (r) { return r.id === id; })[0];
      if (rec) data = await AgentLock.unlock(rec, email, code);
    } catch (x) { data = null; }
    go.disabled = false; go.textContent = "Sign in";
    if (!data) { err.textContent = "We couldn't find that email. Use the work email your trainer has on file."; return; }
    app.innerHTML = AgentCard.html(data);
    out.hidden = false;
    window.scrollTo(0, 0);
  });
  out.addEventListener("click", function () { location.reload(); });
})();
</script>
</body>
</html>
